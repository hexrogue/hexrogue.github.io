name: Render Mermaid Diagrams

on:
  push:
    branches: [ main ]
    paths:
      - 'content/**/*.md'
      - 'scripts/mermaid-theme.json'
      - 'scripts/mermaid-puppeteer.json'
      - 'scripts/render-mermaid.mjs'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install -g @mermaid-js/mermaid-cli
          # The script uses puppeteer. The CLI usually handles chrome, 
          # but we ensure the environment is ready.
          npx @puppeteer/browsers install chrome@stable --path .cache/browsers

      - name: Render Diagrams
        run: node scripts/render-mermaid.mjs

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update mermaid diagrams [skip ci]"
          file_pattern: 'static/images/diagrams/*.svg'
