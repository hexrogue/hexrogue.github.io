<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="monospace" font-size="15" fill="#a8a8a8">
<rect width="680" height="400" fill="#0A0A0A"/>
<g stroke="#2a2a2a" fill="#121212">
<rect x="20" y="20" width="640" height="370"/>
<rect x="20" y="20" width="640" height="34"/>
</g>
<text x="36" y="44" fill="#EAEAEA">wireshark  ·  wlan0, monitor mode</text>
<text x="600" y="44" fill="#FF2A2A">ch 6</text>

<rect x="36" y="70" width="608" height="34" fill="#0f0f0f" stroke="#2a2a2a"/>
<rect x="36" y="70" width="4" height="34" fill="#FF2A2A"/>
<text x="48" y="92" font-size="13" fill="#a8a8a8">filter:</text>
<text x="108" y="92" font-size="13" fill="#EAEAEA">wlan.fc.type_subtype == 0x0c || wlan.fc.type_subtype == 0x08</text>

<g font-size="12" fill="#a8a8a8">
<text x="40" y="136">No.</text>
<text x="70" y="136">Time</text>
<text x="152" y="136">Source</text>
<text x="300" y="136">Destination</text>
<text x="424" y="136">Proto</text>
<text x="472" y="136">Length</text>
<text x="534" y="136">Info</text>
</g>
<line x1="40" y1="146" x2="640" y2="146" stroke="#2a2a2a"/>

<rect x="40" y="152" width="600" height="28" fill="#0f0f0f"/>
<text x="44" y="172" font-size="12">1</text>
<text x="70" y="172" font-size="12">0.000000</text>
<text x="152" y="172" font-size="12" fill="#EAEAEA">02:11:22:33:44:55</text>
<text x="300" y="172" font-size="12">ff:ff:ff:ff:ff:ff</text>
<text x="424" y="172" font-size="12" fill="#FF2A2A">802.11</text>
<text x="472" y="172" font-size="12">26</text>
<text x="534" y="172" font-size="12" fill="#EAEAEA">Deauth, reason 7</text>

<text x="44" y="200" font-size="12">2</text>
<text x="70" y="200" font-size="12">0.000412</text>
<text x="152" y="200" font-size="12" fill="#EAEAEA">24:6f:28:aa:bb:cc</text>
<text x="300" y="200" font-size="12">02:11:22:33:44:55</text>
<text x="424" y="200" font-size="12">802.11</text>
<text x="472" y="200" font-size="12">14</text>
<text x="534" y="200" font-size="12">Acknowledgement</text>

<rect x="40" y="210" width="600" height="28" fill="#0f0f0f"/>
<text x="44" y="230" font-size="12">3</text>
<text x="70" y="230" font-size="12">0.514900</text>
<text x="152" y="230" font-size="12" fill="#EAEAEA">0a:1b:2c:3d:4e:5f</text>
<text x="300" y="230" font-size="12">ff:ff:ff:ff:ff:ff</text>
<text x="424" y="230" font-size="12" fill="#FF2A2A">802.11</text>
<text x="472" y="230" font-size="12">26</text>
<text x="534" y="230" font-size="12" fill="#EAEAEA">Deauth, reason 7</text>

<text x="36" y="272" fill="#a8a8a8" font-size="13">The printed address is the only thing tying the frame to anyone.</text>
<text x="36" y="296" fill="#a8a8a8" font-size="13">Reassociate the AP with its real BSSID and the forged frames show up.</text>

<g stroke="#2a2a2a" fill="#121212">
<rect x="36" y="318" width="608" height="58"/>
</g>
<text x="52" y="344" fill="#FF2A2A" font-size="13">wlan.fc.type_subtype == 0x0c</text>
<text x="336" y="344" fill="#a8a8a8" font-size="13">every deauthentication</text>
<text x="52" y="366" fill="#FF2A2A" font-size="13">!(wlan.ra == 02:11:22:33:44:55)</text>
<text x="336" y="366" fill="#a8a8a8" font-size="13">deauths not sent by your AP</text>
</svg>
