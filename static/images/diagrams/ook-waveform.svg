<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="monospace" font-size="15" fill="#EAEAEA">
<rect width="680" height="250" fill="#0A0A0A"/>
<text x="20" y="30" font-size="17" fill="#FF2A2A">ON-OFF KEYING, THE WHOLE IDEA</text>

<text x="20" y="68" fill="#a8a8a8" font-size="13">bits</text>
<g fill="#EAEAEA" font-size="13" text-anchor="middle">
<text x="125" y="68">1</text>
<text x="225" y="68">0</text>
<text x="325" y="68">1</text>
<text x="425" y="68">1</text>
<text x="525" y="68">0</text>
<text x="625" y="68">1</text>
</g>

<g stroke="#FF2A2A">
<rect x="80" y="84" width="90" height="60" fill="#1a0000"/>
<rect x="280" y="84" width="90" height="60" fill="#1a0000"/>
<rect x="380" y="84" width="90" height="60" fill="#1a0000"/>
<rect x="580" y="84" width="90" height="60" fill="#1a0000"/>
</g>
<g stroke="#2a2a2a">
<rect x="180" y="84" width="90" height="60" fill="#0f0f0f"/>
<rect x="480" y="84" width="90" height="60" fill="#0f0f0f"/>
</g>
<g font-size="13" text-anchor="middle">
<text x="125" y="118" fill="#FF2A2A">carrier</text>
<text x="225" y="118" fill="#a8a8a8">silence</text>
<text x="325" y="118" fill="#FF2A2A">carrier</text>
<text x="425" y="118" fill="#FF2A2A">carrier</text>
<text x="525" y="118" fill="#a8a8a8">silence</text>
<text x="625" y="118" fill="#FF2A2A">carrier</text>
</g>

<line x1="20" y1="172" x2="660" y2="172" stroke="#2a2a2a"/>
<text x="20" y="202" fill="#a8a8a8" font-size="14">a receiver measures how long the carrier stayed on and writes down the pattern</text>
<text x="20" y="230" fill="#EAEAEA" font-size="14">Send that same pattern later and the remote's door, gate or socket cannot tell.</text>
</svg>
