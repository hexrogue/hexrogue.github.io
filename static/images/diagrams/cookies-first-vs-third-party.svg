<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="monospace" font-size="15" fill="#EAEAEA">
<rect width="760" height="420" fill="#0A0A0A"/>
<text x="20" y="30" font-size="17" fill="#FF2A2A">WHO GETS A NAME TAG?</text>
<defs>
<marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#EAEAEA"/>
</marker>
<marker id="dr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#FF2A2A"/>
</marker>
</defs>

<g stroke="#2a2a2a" fill="#121212">
<rect x="20" y="90" width="140" height="80"/>
<rect x="250" y="70" width="180" height="110"/>
<rect x="540" y="70" width="180" height="90"/>
<rect x="540" y="270" width="180" height="70"/>
</g>

<text x="40" y="120">you</text>
<text x="40" y="144" font-size="13" fill="#a8a8a8">browser</text>

<text x="270" y="100">news site</text>
<text x="270" y="124" font-size="13" fill="#a8a8a8">the page you opened</text>

<text x="560" y="100">ad network</text>
<text x="560" y="124" font-size="13" fill="#a8a8a8">a script in the page</text>

<text x="560" y="296">other site</text>
<text x="560" y="320" font-size="13" fill="#a8a8a8">same company, new page</text>

<line x1="160" y1="115" x2="246" y2="115" stroke="#EAEAEA" marker-end="url(#dn)"/>
<text x="168" y="104" font-size="12" fill="#a8a8a8">request</text>

<line x1="246" y1="145" x2="160" y2="145" stroke="#EAEAEA" marker-end="url(#dn)"/>
<text x="168" y="166" font-size="12" fill="#a8a8a8">page + script</text>

<line x1="430" y1="115" x2="536" y2="115" stroke="#EAEAEA" marker-end="url(#dn)"/>
<text x="438" y="104" font-size="12" fill="#a8a8a8">ad script loads</text>

<path d="M540 160 C 420 260, 200 260, 90 170" fill="none" stroke="#FF2A2A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#dr)"/>
<text x="300" y="222" font-size="13" fill="#FF2A2A">ads.com cookie</text>

<line x1="630" y1="160" x2="630" y2="266" stroke="#FF2A2A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#dr)"/>
<text x="644" y="220" font-size="12" fill="#FF2A2A">same id</text>

<text x="20" y="370" font-size="13" fill="#a8a8a8">First-party cookie: set by the site you visited. It remembers your session.</text>
<text x="20" y="394" font-size="13" fill="#EAEAEA">Third-party cookie: set by a domain you never typed. It remembers you across sites.</text>
</svg>
