<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="monospace" font-size="15" fill="#EAEAEA">
<rect width="680" height="400" fill="#0A0A0A"/>
<text x="20" y="30" font-size="17" fill="#FF2A2A">THE FOUR-WAY HANDSHAKE</text>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#EAEAEA"/>
</marker>
</defs>

<text x="40" y="64" fill="#EAEAEA">station</text>
<text x="540" y="64" fill="#EAEAEA">access point</text>
<line x1="80" y1="76" x2="80" y2="360" stroke="#2a2a2a"/>
<line x1="600" y1="76" x2="600" y2="360" stroke="#2a2a2a"/>

<g stroke="#EAEAEA" marker-end="url(#ar)">
<line x1="80" y1="112" x2="592" y2="112"/>
<line x1="600" y1="170" x2="88" y2="170"/>
<line x1="80" y1="228" x2="592" y2="228"/>
<line x1="600" y1="286" x2="88" y2="286"/>
</g>
<g fill="#EAEAEA" font-size="14">
<text x="100" y="104">1. ANonce <tspan fill="#FF2A2A">(+ PMKID on WPA2)</tspan></text>
<text x="360" y="162">2. SNonce + MIC</text>
<text x="100" y="220">3. GTK + MIC</text>
<text x="360" y="278">4. ACK</text>
</g>

<text x="20" y="336" fill="#a8a8a8" font-size="13">EAPOL frames, ether type 0x888E, sent before any encryption exists, so all four</text>
<text x="20" y="360" fill="#a8a8a8" font-size="13">are readable. Neither side sends the passphrase, so the capture tests guesses.</text>
</svg>
