<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="monospace" font-size="15" fill="#EAEAEA">
<rect width="680" height="320" fill="#0A0A0A"/>
<text x="20" y="30" font-size="17" fill="#FF2A2A">FROM TICKET TO PASSWORD</text>
<defs>
<marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#EAEAEA"/>
</marker>
</defs>

<g stroke="#2a2a2a" fill="#121212">
<rect x="20" y="86" width="140" height="88"/>
<rect x="190" y="86" width="140" height="88"/>
<rect x="360" y="86" width="140" height="88"/>
<rect x="530" y="86" width="140" height="88"/>
</g>
<text x="36" y="114" fill="#EAEAEA">access point</text>
<text x="36" y="140" fill="#a8a8a8" font-size="13">message 1</text>
<text x="206" y="114" fill="#EAEAEA">sniffer</text>
<text x="206" y="140" fill="#a8a8a8" font-size="13">PMKID + SSID</text>
<text x="376" y="114" fill="#EAEAEA">hash line</text>
<text x="376" y="140" fill="#a8a8a8" font-size="13">mode 22000</text>
<text x="546" y="114" fill="#EAEAEA">hashcat</text>
<text x="546" y="140" fill="#a8a8a8" font-size="13">guess, derive,</text>
<text x="546" y="160" fill="#a8a8a8" font-size="13">compare</text>

<g stroke="#EAEAEA" marker-end="url(#pf)">
<line x1="162" y1="130" x2="186" y2="130"/>
<line x1="332" y1="130" x2="356" y2="130"/>
<line x1="502" y1="130" x2="526" y2="130"/>
</g>

<line x1="90" y1="174" x2="90" y2="214" stroke="#a8a8a8" marker-end="url(#pf)"/>
<text x="20" y="238" fill="#a8a8a8" font-size="13">no match, next guess</text>
<line x1="600" y1="174" x2="600" y2="214" stroke="#FF2A2A" marker-end="url(#pf)"/>
<text x="512" y="238" fill="#FF2A2A" font-size="13">passphrase found</text>

<text x="20" y="284" fill="#a8a8a8" font-size="14">Nothing is decrypted. The guess is derived the same way the router derived</text>
<text x="20" y="308" fill="#a8a8a8" font-size="14">its ticket, then the two are compared.</text>
</svg>
