<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="monospace" font-size="15" fill="#EAEAEA">
<rect width="680" height="400" fill="#0A0A0A"/>
<text x="20" y="30" font-size="17" fill="#FF2A2A">VOLTAGE IS PRESSURE, CURRENT IS FLOW</text>
<defs>
<marker id="ep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#EAEAEA"/>
</marker>
</defs>

<g stroke="#2a2a2a" fill="#121212">
<rect x="20" y="80" width="130" height="100"/>
</g>
<text x="48" y="128" font-size="18" fill="#FF2A2A">9 V</text>
<text x="48" y="154" fill="#a8a8a8" font-size="13">the push</text>

<polyline points="150,105 350,105 350,120 430,120 430,105 630,105" fill="none" stroke="#EAEAEA" stroke-width="2"/>
<polyline points="150,155 350,155 350,140 430,140 430,155 630,155" fill="none" stroke="#EAEAEA" stroke-width="2"/>

<g stroke="#FF2A2A" marker-end="url(#ep)">
<line x1="200" y1="130" x2="252" y2="130"/>
<line x1="300" y1="130" x2="326" y2="130"/>
<line x1="480" y1="130" x2="532" y2="130"/>
</g>

<text x="170" y="92" fill="#a8a8a8" font-size="13">voltage: how hard it wants to move</text>
<text x="150" y="186" fill="#a8a8a8" font-size="13">current: how much actually moves</text>
<line x1="390" y1="158" x2="390" y2="206" stroke="#2a2a2a"/>
<text x="340" y="226" fill="#FF2A2A" font-size="13">resistance: the narrow bit</text>

<g stroke="#2a2a2a" fill="#121212">
<rect x="190" y="252" width="300" height="62"/>
</g>
<text x="212" y="286" font-size="17" fill="#FF2A2A">V = I × R</text>
<text x="212" y="306" fill="#a8a8a8" font-size="13">voltage = current × resistance</text>

<text x="20" y="356" fill="#EAEAEA" font-size="13">Big pressure and a tiny pipe, still no flow. You need both, and that is most of EE.</text>
<text x="20" y="380" fill="#a8a8a8" font-size="13">A thin cable means more ohms, and more ohms means the wire gets warm instead.</text>
</svg>
