<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="monospace" font-size="15" fill="#EAEAEA">
<rect width="680" height="350" fill="#0A0A0A"/>
<text x="20" y="30" font-size="17" fill="#FF2A2A">ONE RADIO, TWO JOBS, ONE CHANNEL</text>
<defs>
<marker id="dr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#EAEAEA"/>
</marker>
</defs>

<g stroke="#2a2a2a" fill="#121212">
<rect x="20" y="76" width="150" height="92"/>
<rect x="250" y="62" width="180" height="120" stroke="#FF2A2A"/>
<rect x="510" y="76" width="150" height="92"/>
</g>
<text x="36" y="106" fill="#EAEAEA">your phone</text>
<text x="36" y="130" fill="#a8a8a8">station</text>
<text x="36" y="154" fill="#a8a8a8">on ESP32_DASH</text>
<text x="266" y="92" fill="#EAEAEA">ESP32</text>
<text x="266" y="118" fill="#FF2A2A">AP + STA</text>
<text x="266" y="142" fill="#a8a8a8">one radio</text>
<text x="266" y="164" fill="#a8a8a8">one antenna</text>
<text x="526" y="106" fill="#EAEAEA">home router</text>
<text x="526" y="130" fill="#a8a8a8">HomeWiFi</text>

<g stroke="#EAEAEA" marker-end="url(#dr)">
<line x1="172" y1="122" x2="244" y2="122"/>
<line x1="432" y1="122" x2="504" y2="122"/>
</g>
<text x="174" y="112" fill="#a8a8a8" font-size="13">channel 1</text>
<text x="434" y="112" fill="#a8a8a8" font-size="13">channel 6</text>

<text x="20" y="222" fill="#a8a8a8">the same radio, taking turns between the two jobs:</text>
<g stroke="#2a2a2a" fill="#121212">
<rect x="20" y="238" width="80" height="46"/>
<rect x="100" y="238" width="80" height="46"/>
<rect x="180" y="238" width="80" height="46"/>
<rect x="260" y="238" width="80" height="46"/>
<rect x="340" y="238" width="80" height="46"/>
<rect x="420" y="238" width="80" height="46"/>
<rect x="500" y="238" width="80" height="46"/>
<rect x="580" y="238" width="80" height="46"/>
</g>
<g fill="#EAEAEA" font-size="14" text-anchor="middle">
<text x="60" y="266">ch 1</text>
<text x="140" y="266">ch 6</text>
<text x="220" y="266">ch 1</text>
<text x="300" y="266">ch 6</text>
<text x="380" y="266">ch 1</text>
<text x="460" y="266">ch 6</text>
<text x="540" y="266">ch 1</text>
<text x="620" y="266">ch 6</text>
</g>

<text x="20" y="318" fill="#FF2A2A">The moment the hopper takes channel control, the upstream link drops:</text>
<text x="20" y="340" fill="#FF2A2A">cannot set channel while the station is connected.</text>
</svg>
