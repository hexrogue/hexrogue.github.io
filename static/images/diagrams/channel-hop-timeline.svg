<text x="20" y="252" fill="#EAEAEA" font-size="14">A device that beacons every 100 ms is heard three or four times per sweep.</text>
<text x="20" y="278" fill="#a8a8a8" font-size="14">A quiet device, or one that only transmits while it connects, can be missed.</text>
<text x="20" y="304" fill="#FF2A2A" font-size="14">Missing from the table does not mean missing from the room.</text>
