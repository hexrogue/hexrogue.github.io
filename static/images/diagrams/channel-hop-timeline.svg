<text x="20" y="52" fill="#FF2A2A" font-size="13">heard</text>
<text x="126" y="52" fill="#a8a8a8" font-size="13">the rest landed while the radio was on another channel</text>

<text x="20" y="152" fill="#a8a8a8" font-size="13">the radio: 300 ms per channel, 13 channels, one sweep every 3.9 seconds</text>
