<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="monospace" font-size="15" fill="#EAEAEA">
<rect width="680" height="420" fill="#0A0A0A"/>
<text x="20" y="30" font-size="17" fill="#FF2A2A">ONE CHANGED NUMBER, ONE LEAK</text>
<defs>
<marker id="id" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#EAEAEA"/>
</marker>
</defs>

<g stroke="#2a2a2a" fill="#121212">
<rect x="20" y="70" width="190" height="110"/>
<rect x="300" y="50" width="360" height="170"/>
</g>
<text x="36" y="100" fill="#EAEAEA">your browser</text>
<text x="36" y="126" fill="#a8a8a8" font-size="13">cookie: user A</text>
<text x="36" y="150" fill="#FF2A2A" font-size="13">GET /orders/1002</text>

<line x1="212" y1="125" x2="296" y2="125" stroke="#EAEAEA" marker-end="url(#id)"/>

<text x="320" y="80" fill="#EAEAEA">the server</text>
<line x1="320" y1="92" x2="640" y2="92" stroke="#2a2a2a"/>
<text x="320" y="124" fill="#a8a8a8" font-size="13">is the asker logged in?  yes, user A</text>
<text x="320" y="152" fill="#FF2A2A" font-size="13">does user A own order 1002?  not asked</text>
<line x1="320" y1="166" x2="640" y2="166" stroke="#2a2a2a"/>
<text x="320" y="194" fill="#EAEAEA" font-size="13">response: the order, sent to whoever asked</text>

<g stroke="#2a2a2a" fill="#121212">
<rect x="20" y="240" width="640" height="70"/>
<rect x="20" y="326" width="640" height="76"/>
</g>
<text x="36" y="270" fill="#EAEAEA" font-size="13">Back comes a stranger's receipt: name, address, phone, what they paid.</text>
<text x="36" y="356" fill="#FF2A2A" font-size="13">The fix: on every request, look up who owns the thing and refuse when the</text>
<text x="36" y="380" fill="#a8a8a8" font-size="13">asker differs. One shared function, on the server, every single time.</text>
</svg>
