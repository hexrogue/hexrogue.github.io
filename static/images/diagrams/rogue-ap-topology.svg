<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="monospace" font-size="15" fill="#EAEAEA">
<rect width="680" height="350" fill="#0A0A0A"/>
<text x="20" y="30" font-size="17" fill="#FF2A2A">SAME NAME, TWO RADIOS</text>
<defs>
<marker id="rb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#FF2A2A"/>
</marker>
<marker id="rg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#a8a8a8"/>
</marker>
</defs>

<g stroke="#2a2a2a" fill="#121212">
<rect x="20" y="60" width="250" height="110"/>
<rect x="410" y="60" width="250" height="110" stroke="#FF2A2A"/>
</g>
<text x="36" y="90" fill="#EAEAEA">YOUR AP</text>
<text x="36" y="120" fill="#a8a8a8" font-size="13">SSID: HOME</text>
<text x="36" y="146" fill="#a8a8a8" font-size="13">BSSID: 02:11:22:33:44:55</text>

<text x="426" y="90" fill="#FF2A2A">ROGUE AP</text>
<text x="426" y="120" fill="#a8a8a8" font-size="13">SSID: HOME</text>
<text x="426" y="146" fill="#a8a8a8" font-size="13">BSSID: aa:bb:cc:dd:ee:ff</text>

<g stroke="#2a2a2a" fill="#121212">
<rect x="240" y="226" width="200" height="80"/>
</g>
<text x="256" y="258" fill="#EAEAEA">your phone</text>
<text x="256" y="284" fill="#a8a8a8" font-size="13">remembers HOME</text>

<line x1="268" y1="226" x2="180" y2="172" stroke="#a8a8a8" marker-end="url(#rg)"/>
<line x1="412" y1="226" x2="500" y2="172" stroke="#FF2A2A" stroke-width="2" marker-end="url(#rb)"/>
<text x="150" y="208" fill="#a8a8a8" font-size="13">-74 dBm</text>
<text x="508" y="208" fill="#FF2A2A" font-size="13">-38 dBm</text>

<text x="20" y="334" fill="#EAEAEA" font-size="14">The phone does not ask which radio owns the name. It joins the stronger one.</text>
</svg>
