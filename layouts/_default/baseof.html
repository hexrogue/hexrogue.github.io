<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en-us" }}">
  {{- partial "head.html" . -}}
  <body class="{{ if .IsPage }}reading{{ end }}">
    <a href="#content" class="skip-link">Skip to content</a>
    {{- partial "nav.html" . -}}
    <main id="content" data-pagefind-body>
      {{- block "main" . }}{{ end -}}
    </main>
    {{- partial "footer.html" . -}}
  </body>
</html>
