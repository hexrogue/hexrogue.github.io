{{ define "main" }}
<div class="page">
  <p class="telemetry">/// {{ .Title | upper }}</p>
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ if not .IsHome }}
  <ul class="index-list">
    {{ range .Pages.ByDate.Reverse }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <span class="meta"><time>{{ .Date.Format "2006-01-02" }}</time>{{ with .Params.tags }} / {{ delimit . ", " }}{{ end }}</span>
    </li>
    {{ end }}
  </ul>
  {{ end }}
</div>
{{ end }}
