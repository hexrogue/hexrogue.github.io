<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {{- $desc := or .Description .Site.Params.description -}}
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ with .Title }}{{ . }} / {{ end }}{{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ $desc }}" />
  {{ with .Params.tags }}<meta name="keywords" content="{{ delimit . ", " }}" />{{ end }}
  <meta name="author" content="{{ .Site.Params.author.name }}" />
  <link rel="canonical" href="{{ .Permalink }}" />
  <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}" />
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}" />
  {{ range .AlternativeOutputFormats -}}
  <link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink }}" title="{{ $.Site.Title }}" />
  {{ end -}}
  <meta property="og:site_name" content="{{ .Site.Title }}" />
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ with .Title }}{{ . }}{{ end }}{{ end }}" />
  <meta property="og:description" content="{{ $desc }}" />
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
  <meta property="og:url" content="{{ .Permalink }}" />
  {{ if .IsPage }}<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}" />{{ end }}
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ with .Title }}{{ . }}{{ end }}{{ end }}" />
  <meta name="twitter:description" content="{{ $desc }}" />
  {{ if .IsPage }}
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"BlogPosting","headline":{{ .Title | jsonify }},"description":{{ $desc | jsonify }},"datePublished":"{{ .Date.Format "2006-01-02" }}","author":{"@type":"Person","name":{{ .Site.Params.author.name | jsonify }}},"mainEntityOfPage":{{ .Permalink | jsonify }}}
  </script>
  {{ end }}
</head>
